<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>神をも超えし者</title>
<style>
/* ===== RESET & BASE ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{
  display:flex;flex-direction:column;
  background:#111;color:#e0d8c8;
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  font-size:13px;max-width:480px;margin:0 auto;height:100dvh;
  image-rendering:pixelated;
}

/* ===== TOP BAR ===== */
.topbar{
  background:linear-gradient(180deg,#1a1208,#0d0c08);
  border-bottom:2px solid #5a4010;
  padding:4px 8px;display:flex;align-items:center;gap:6px;
  flex-shrink:0;height:40px;
  box-shadow:0 2px 8px rgba(0,0,0,.6);
}
.top-avatar{
  width:30px;height:30px;border-radius:4px;
  background:linear-gradient(135deg,#2a2050,#4a3080);
  border:2px solid #8866cc;display:flex;align-items:center;justify-content:center;
  font-size:18px;position:relative;
}
.top-lv-badge{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  background:#cc3300;border:1px solid #ff5500;border-radius:3px;
  padding:0 4px;font-size:8px;font-weight:900;color:#fff;white-space:nowrap;
}
.top-name{font-size:11px;font-weight:700;color:#f0d890;}
.top-expbar-wrap{flex:1;display:flex;flex-direction:column;gap:1px;}
.top-expbar{height:5px;background:#1a1a0a;border-radius:2px;overflow:hidden;border:1px solid #3a3010;}
.top-expfill{height:100%;background:linear-gradient(90deg,#44aaff,#88ddff);border-radius:2px;transition:width .3s;}
.top-exptext{font-size:7px;color:#8080a0;text-align:right;}
.top-res{display:flex;gap:5px;}
.res-pill{
  display:flex;align-items:center;gap:3px;
  background:#0a0808;border:1px solid #3a2810;
  border-radius:10px;padding:2px 7px;font-size:11px;font-weight:700;
}
.res-pill.gold{color:#f0c040;border-color:#5a4010;}
.res-pill.gem{color:#60c8ff;border-color:#103a5a;}
.top-icons{display:flex;gap:3px;margin-left:4px;}
.top-icon{
  width:26px;height:26px;background:#1a1408;border:1px solid #3a2810;
  border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;
}

/* ===== BATTLE SCENE ===== */
.battle{
  flex:1 1 0;min-height:0;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0a1520 0%,#0d1e10 50%,#060d08 100%);
}
/* 疑似ピクセル背景ツリー */
.battle::before{
  content:'';position:absolute;bottom:0;left:0;right:0;height:45%;
  background:linear-gradient(0deg,rgba(4,8,4,.9),transparent);
  z-index:1;
}

/* ステージ情報バー */
.stage-bar{
  position:absolute;top:0;left:0;right:0;z-index:5;
  background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);
  padding:5px 8px;display:flex;align-items:center;justify-content:space-between;
}
.stage-name{
  background:rgba(0,0,0,.6);border:1px solid rgba(200,160,40,.4);
  border-radius:4px;padding:2px 10px;font-size:11px;font-weight:700;
  color:#f0d890;letter-spacing:1px;
}
.stage-clear-info{font-size:9px;color:#a0a080;text-align:right;}
.stage-clear-info b{color:#60c8ff;}

/* 敵HPバー */
.enemy-hpwrap{
  position:absolute;top:28px;left:8px;right:8px;z-index:5;
}
.enemy-hp-bg{
  height:14px;background:#1a0808;border:2px solid #5a1010;border-radius:3px;overflow:hidden;
  position:relative;
}
.enemy-hp-fill{
  height:100%;background:linear-gradient(90deg,#cc2020,#ff4040);
  transition:width .25s;border-radius:2px;
}
.enemy-hp-text{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);
}

/* ゴールドポップ */
.gold-pop{
  position:absolute;left:8px;font-size:13px;font-weight:900;color:#f0c040;
  animation:gpop 1.5s ease-out forwards;z-index:8;pointer-events:none;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
@keyframes gpop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}

/* キャラクター表示エリア */
.chars-area{
  position:absolute;bottom:55px;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 12px;z-index:3;
}
.player-side,.enemy-side{display:flex;flex-direction:column;align-items:center;gap:2px;}
.player-sprite{
  font-size:48px;animation:walk .6s steps(2) infinite;
  filter:drop-shadow(2px 4px 0 rgba(0,0,0,.8));
}
@keyframes walk{0%{transform:scaleX(1) translateY(0)}50%{transform:scaleX(1) translateY(-3px)}100%{transform:scaleX(1) translateY(0)}}
.enemy-sprite{
  font-size:52px;animation:enemymove .8s steps(2) infinite;
  filter:drop-shadow(-2px 4px 0 rgba(0,0,0,.8));
}
@keyframes enemymove{0%{transform:scaleX(-1) translateX(0)}50%{transform:scaleX(-1) translateX(-4px)}100%{transform:scaleX(-1) translateX(0)}}
.char-name{
  font-size:9px;font-weight:700;color:#f0d890;
  background:rgba(0,0,0,.6);border-radius:10px;padding:1px 8px;
}
.char-hpbar{width:70px;height:5px;background:#0a1a0a;border-radius:2px;overflow:hidden;border:1px solid #1a3a1a;}
.char-hpfill{height:100%;background:linear-gradient(90deg,#20aa20,#40dd40);border-radius:2px;transition:width .2s;}
.enemy-hpbar-mini{width:80px;height:5px;background:#1a0a0a;border-radius:2px;overflow:hidden;border:1px solid #3a1a1a;}
.enemy-hpfill-mini{height:100%;background:linear-gradient(90deg,#aa2020,#dd4040);border-radius:2px;transition:width .2s;}

/* ダメージ数字 */
.dmg-num{
  position:absolute;font-weight:900;pointer-events:none;
  animation:dnum .8s ease-out forwards;z-index:10;
  text-shadow:-1px -1px 0 rgba(0,0,0,.9),1px 1px 0 rgba(0,0,0,.9);
  font-style:italic;letter-spacing:-1px;
}
@keyframes dnum{
  0%{opacity:1;transform:translate(-50%,0) scale(1.2);}
  100%{opacity:0;transform:translate(-50%,-80px) scale(.7);}
}

/* 地面 */
.ground{
  position:absolute;bottom:50px;left:0;right:0;height:6px;
  background:linear-gradient(180deg,#2a3a1a,#1a2a10);
  border-top:2px solid #3a4a20;z-index:2;
}

/* 下部情報バー */
.scene-foot{
  position:absolute;bottom:0;left:0;right:0;z-index:6;
  background:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,.5));
  padding:4px 8px;display:flex;align-items:center;gap:8px;
}
.scene-lv{font-size:10px;color:#a0a080;}
.scene-lv strong{color:#f0d890;font-size:13px;}
.scene-bars{flex:1;display:flex;flex-direction:column;gap:2px;}
.s-row{display:flex;align-items:center;gap:4px;}
.s-lbl{font-size:8px;color:#6060a0;width:18px;flex-shrink:0;}
.s-bg{flex:1;height:6px;background:#0a0a14;border-radius:2px;overflow:hidden;border:1px solid #1a1a2a;}
.s-fill{height:100%;border-radius:2px;transition:width .3s;}
.s-fill.hp{background:linear-gradient(90deg,#cc2020,#ff4040);}
.s-fill.exp{background:linear-gradient(90deg,#2060cc,#4088ff);}
.s-val{font-size:8px;color:#6060a0;width:55px;text-align:right;flex-shrink:0;}
.scene-pt{font-size:9px;text-align:right;}
.auto-badge{
  position:absolute;right:8px;top:-20px;
  background:#1a1408;border:1px solid #5a4010;border-radius:4px;
  padding:2px 8px;font-size:9px;color:#c0a040;cursor:pointer;
}

/* スキルバー */
.skill-bar{
  position:absolute;bottom:50px;left:0;right:0;z-index:4;
  display:flex;align-items:center;padding:4px 6px;gap:4px;
  background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);
}
.skill-slot{
  width:44px;height:44px;border-radius:6px;
  border:2px solid #3a3020;background:#0a0808;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  cursor:pointer;transition:all .12s;position:relative;flex-shrink:0;
}
.skill-slot.active{border-color:#c0a040;}
.skill-slot.locked{opacity:.4;}
.skill-slot::after{
  content:attr(data-label);position:absolute;bottom:1px;
  font-size:7px;color:#a09070;font-weight:700;
}
.skill-add{
  width:44px;height:44px;border-radius:6px;
  border:2px dashed #3a3020;background:transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#3a3020;
}

/* ===== BOTTOM PANEL ===== */
.panel{
  background:#0a0808;border-top:3px solid #3a2810;
  flex-shrink:0;display:flex;flex-direction:column;
  height:50%;min-height:0;
}

/* タブ (強化/成長/昇級スタイル) */
.tabs{
  display:flex;background:#0d0a06;border-bottom:1px solid #2a1a08;
  flex-shrink:0;overflow-x:auto;
}
.tab{
  flex:none;min-width:60px;padding:7px 10px;
  font-size:11px;font-weight:700;color:#706050;
  text-align:center;cursor:pointer;
  border-bottom:3px solid transparent;
  transition:all .15s;white-space:nowrap;
  border-right:1px solid #1a1208;
}
.tab.active{color:#f0d890;border-bottom-color:#c0a040;background:#14100a;}
.tab:active{background:#1a1208;}

.panel-body{flex:1;overflow-y:auto;min-height:0;}
.panel-body::-webkit-scrollbar{width:3px;}
.panel-body::-webkit-scrollbar-thumb{background:#3a2810;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

/* ===== 強化リスト（スレイヤーレジェンド完全再現） ===== */
.enhance-wrap{padding:6px;}

/* LevelUp ボタン */
.levelup-row{
  background:linear-gradient(180deg,#1a1408,#100e06);
  border:1px solid #3a2810;border-radius:6px;
  padding:8px 10px;margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
}
.levelup-avatar{
  width:40px;height:40px;border-radius:4px;
  background:linear-gradient(135deg,#2a2050,#4a3080);
  border:2px solid #8866cc;display:flex;align-items:center;justify-content:center;font-size:24px;
}
.levelup-info{flex:1;}
.levelup-lv{font-size:12px;font-weight:700;color:#f0d890;}
.levelup-expbar-bg{height:6px;background:#0a0a14;border-radius:3px;overflow:hidden;border:1px solid #1a1a2a;margin-top:4px;}
.levelup-expbar-fill{height:100%;background:linear-gradient(90deg,#2060cc,#4088ff);border-radius:3px;transition:width .3s;}
.levelup-exptext{font-size:8px;color:#6060a0;margin-top:2px;}
.levelup-btn{
  background:linear-gradient(180deg,#28cc44,#18992e);
  border:2px solid #40ff60;border-radius:6px;
  padding:8px 14px;font-size:13px;font-weight:900;color:#fff;
  cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 8px rgba(40,200,60,.4);
  text-shadow:0 1px 2px rgba(0,0,0,.6);
  transition:all .12s;
}
.levelup-btn:active{transform:scale(.95);}
.levelup-btn.off{background:linear-gradient(180deg,#2a3a2a,#1a2a1a);border-color:#3a5a3a;color:#506050;box-shadow:none;}

/* 強化アイテム行（スレイヤーレジェンド風） */
.enh-item{
  background:linear-gradient(180deg,#1a1408,#120f06);
  border:1px solid #2a1a08;border-bottom:1px solid #0a0804;
  padding:8px 10px;display:flex;align-items:center;gap:8px;
  cursor:pointer;transition:background .1s;
}
.enh-item:active{background:#1e1a0e;}
.enh-item:last-child{border-bottom:none;}
.enh-ico{
  width:46px;height:46px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  border:2px solid #3a2810;background:#0a0606;
  position:relative;overflow:hidden;
}
.enh-ico-shine{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);
}
.enh-center{flex:1;min-width:0;}
.enh-name{font-size:12px;font-weight:700;color:#e0d0b0;margin-bottom:1px;}
.enh-lv-bar-bg{height:4px;background:#0a0804;border-radius:2px;overflow:hidden;margin:3px 0;}
.enh-lv-bar-fill{height:100%;background:linear-gradient(90deg,#c0a030,#f0d060);border-radius:2px;transition:width .3s;}
.enh-change{font-size:10px;color:#80c080;}
.enh-lv-txt{font-size:9px;color:#806040;float:right;}
.enh-btn{
  width:50px;height:50px;border-radius:50%;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 40% 30%,#f0d060,#c07810);
  border:none;box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);
  transition:all .12s;position:relative;
}
.enh-btn:active{transform:scale(.9);box-shadow:0 1px 4px rgba(0,0,0,.5);}
.enh-btn.off{
  background:radial-gradient(circle at 40% 30%,#3a3020,#1a1808);
  box-shadow:none;cursor:not-allowed;
}
.enh-btn-cost{font-size:8px;font-weight:900;color:#3a2000;line-height:1.1;}
.enh-btn-coin{font-size:14px;line-height:1;}

/* idle収益 */
.idle-banner{
  background:linear-gradient(180deg,#1a1206,#100e04);
  border:1px solid #3a2810;border-radius:6px;
  padding:8px 10px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;
}
.idle-info{display:flex;flex-direction:column;gap:1px;}
.idle-gold-amt{font-size:15px;font-weight:900;color:#f0c040;}
.idle-sub{font-size:8px;color:#706040;}
.idle-claim-btn{
  background:linear-gradient(180deg,#cc8820,#aa6600);
  border:2px solid #f0a030;border-radius:6px;
  padding:7px 14px;font-size:11px;font-weight:900;color:#fff;
  cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.idle-claim-btn:active{transform:scale(.95);}

/* ===== 成長（Lv振り分け） ===== */
.growth-wrap{padding:6px;}
.growth-pt-card{
  background:linear-gradient(180deg,#0a1a08,#061006);
  border:2px solid #2a5a1a;border-radius:6px;
  padding:10px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.growth-pt-num{font-size:28px;font-weight:900;color:#40dd40;}
.growth-pt-lbl{font-size:9px;color:#408040;}
.growth-item{
  background:linear-gradient(180deg,#1a1408,#120f06);
  border:1px solid #2a1a08;padding:9px 10px;
  display:flex;align-items:center;gap:10px;
  border-radius:6px;margin-bottom:5px;cursor:pointer;transition:all .12s;
}
.growth-item:active{transform:scale(.98);}
.growth-item.off{opacity:.3;cursor:not-allowed;}
.growth-ico{font-size:26px;width:40px;text-align:center;flex-shrink:0;}
.growth-info{flex:1;}
.growth-nm{font-size:13px;font-weight:700;color:#e0d0b0;}
.growth-detail{font-size:9px;color:#806040;margin-top:2px;}
.growth-val{font-size:10px;color:#40dd40;margin-top:1px;}
.growth-plus{
  width:36px;height:36px;background:linear-gradient(180deg,#28aa28,#187818);
  border:2px solid #40cc40;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#fff;flex-shrink:0;
}

/* ===== 昇級（職業）===== */
.promo-wrap{padding:6px;}
.promo-cur-card{
  background:linear-gradient(135deg,#1a1206,#2a1e08);
  border:2px solid #c0a030;border-radius:8px;
  padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
}
.promo-cur-ico{font-size:40px;}
.promo-cur-info{}
.promo-cur-nm{font-size:17px;font-weight:900;color:#f0d890;}
.promo-cur-sub{font-size:9px;color:#806040;margin-top:2px;}
.promo-mul-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.promo-mul-chip{
  background:#0a0804;border:1px solid #3a2810;
  border-radius:4px;padding:2px 7px;font-size:9px;color:#c0d060;
}
.promo-next-card{
  background:linear-gradient(180deg,#121008,#0a0a06);
  border:1px solid #2a1a08;border-radius:8px;padding:10px;margin-bottom:8px;
}
.promo-next-lbl{font-size:9px;color:#806040;letter-spacing:1px;margin-bottom:4px;}
.promo-next-nm{font-size:15px;font-weight:900;color:#e0d0b0;margin-bottom:8px;}
.quest-row{
  background:#0d0a06;border:1px solid #2a1808;border-radius:6px;
  padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:4px;
}
.quest-row.done{border-color:#2a4a1a;background:#0a100a;}
.quest-check{
  width:22px;height:22px;border-radius:50%;border:2px solid #3a2810;
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
}
.quest-row.done .quest-check{background:#1a3a10;border-color:#40aa20;color:#40dd20;}
.quest-txt{flex:1;font-size:11px;color:#c0b090;}
.quest-prog{font-size:9px;color:#706040;margin-top:2px;}
.quest-prog b{color:#c0a030;}
.promo-btn{
  width:100%;border:none;border-radius:8px;padding:13px;
  font-size:14px;font-weight:900;cursor:pointer;margin-top:8px;transition:all .12s;
  background:linear-gradient(180deg,#2a2818,#1a1a0a);color:#505030;pointer-events:none;
}
.promo-btn.ready{
  background:linear-gradient(180deg,#c0a030,#806010);
  color:#fff;pointer-events:all;
  border:2px solid #f0d060;
  box-shadow:0 4px 15px rgba(192,160,48,.5);
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
.promo-btn.ready:active{transform:scale(.97);}

/* ===== クリティカル ===== */
.crit-wrap{padding:6px;}
.crit-info-txt{font-size:9px;color:#706040;margin-bottom:8px;padding:4px 6px;background:#0d0a06;border-radius:4px;}
.crit-row{
  background:linear-gradient(180deg,#1a1408,#120f06);
  border:1px solid #2a1808;border-radius:6px;
  padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:5px;
}
.crit-row.def-on{border-color:#c0a030;}
.crit-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.crit-mid{flex:1;min-width:0;}
.crit-nm{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;}
.def-badge{font-size:7px;background:#c0a030;color:#0a0804;border-radius:3px;padding:1px 4px;font-weight:900;}
.lock-txt{font-size:9px;color:#504030;}
.crit-stat{font-size:9px;color:#706040;margin-top:2px;}
.crit-rbar{height:4px;background:#0a0804;border-radius:2px;overflow:hidden;margin-top:3px;border:1px solid #1a1008;}
.crit-rfill{height:100%;border-radius:2px;transition:width .3s;}
.crit-btns{display:flex;flex-direction:column;gap:3px;}
.sm-btn{
  background:#0d0a06;border:1px solid #2a1808;border-radius:5px;
  padding:4px 8px;font-size:9px;color:#c0b090;cursor:pointer;white-space:nowrap;
  transition:all .12s;display:flex;flex-direction:column;align-items:center;
}
.sm-btn:active{transform:scale(.9);}
.sm-btn.off{opacity:.25;cursor:not-allowed;}
.sm-cost{font-size:7px;color:#c0a030;}

/* ===== スキルツリー ===== */
.skill-wrap{padding:6px;}
.skill-pt-head{
  background:linear-gradient(135deg,#100a18,#180e28);border:1px solid #3a2050;
  border-radius:6px;padding:10px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.skill-pt-num{font-size:24px;font-weight:900;color:#a080e0;}
.skill-cat-title{
  font-size:10px;color:#706040;letter-spacing:1px;
  margin-bottom:6px;padding:3px 8px;background:#0d0a06;border-radius:4px;
}
.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px;}
.skill-node{
  background:#0d0a06;border:2px solid #2a1808;border-radius:8px;
  padding:8px 5px;text-align:center;cursor:pointer;transition:all .15s;
}
.skill-node:active{transform:scale(.94);}
.skill-node.on{border-color:#c0a030;background:#14100a;}
.skill-node.maxed{border-color:#40aa20;background:#0a100a;}
.skill-node.locked{opacity:.3;cursor:not-allowed;}
.skill-node-ico{font-size:20px;margin-bottom:3px;}

.skill-node-lv{font-size:7px;color:#c0a030;margin-top:3px;}

/* ===== ペット ===== */
.pet-wrap{padding:6px;}
.pet-slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.pet-slot{
  background:#0d0a06;border:2px solid #2a1808;border-radius:8px;
  padding:10px;text-align:center;cursor:pointer;transition:all .15s;
}
.pet-slot.filled{border-color:#c0a030;}
.pet-slot:active{transform:scale(.96);}
.pet-slot-ico{font-size:30px;margin-bottom:3px;}
.pet-slot-nm{font-size:11px;font-weight:700;color:#e0d0b0;}
.pet-slot-stat{font-size:9px;color:#40dd40;margin-top:2px;}
.pet-inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px;}
.pet-card{
  background:#0d0a06;border:2px solid #2a1808;border-radius:8px;
  padding:7px 5px;text-align:center;cursor:pointer;transition:all .15s;
}
.pet-card:active{transform:scale(.94);}
.pet-card.sel{border-color:#c0a030;background:#14100a;}
.pet-card-ico{font-size:26px;}
.pet-card-rar{font-size:7px;font-weight:700;border-radius:3px;padding:1px 4px;margin-top:2px;display:inline-block;}
.pet-card-nm{font-size:8px;font-weight:700;color:#c0b090;margin-top:2px;}
.pet-card-stat{font-size:7px;color:#40dd40;}
.pet-equip-btn,.pet-gacha-btn{
  width:100%;border:none;border-radius:6px;padding:9px;
  font-size:12px;font-weight:900;cursor:pointer;margin-top:5px;transition:all .12s;
}
.pet-equip-btn{background:linear-gradient(180deg,#28aa28,#187818);border:2px solid #40cc40;color:#fff;}
.pet-gacha-btn{background:linear-gradient(180deg,#183060,#101a40);border:2px solid #2050a0;color:#80c0ff;}
.pet-equip-btn:active,.pet-gacha-btn:active{transform:scale(.97);}

/* ===== 装備 ===== */
.eq-wrap{padding:6px;}
.eq-slot{
  background:linear-gradient(180deg,#1a1408,#120f06);
  border:1px solid #2a1808;border-radius:6px;

}
.eq-slot-ico{

}
.eq-slot-info{flex:1;}
.eq-slot-type{font-size:9px;color:#706040;}

.eq-slot-stat{font-size:9px;color:#40dd40;margin-top:2px;}
.eq-change-btn{
  background:#0d0a06;border:1px solid #2a1808;border-radius:5px;
  padding:5px 10px;font-size:10px;color:#c0b090;cursor:pointer;flex-shrink:0;
}
.eq-change-btn:active{transform:scale(.94);}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;}
.inv-card{
  background:#0a0606;border:2px solid #2a1808;border-radius:6px;
  padding:5px 3px;text-align:center;cursor:pointer;transition:all .12s;
}
.inv-card:active{transform:scale(.94);}
.inv-card.sel{border-color:#c0a030!important;background:#14100a;}
.inv-card-ico{font-size:22px;}
.inv-card-rar{font-size:7px;font-weight:700;border-radius:2px;padding:1px 3px;display:inline-block;margin-top:1px;}
.inv-card-nm{font-size:7px;color:#a09070;margin-top:1px;}
.inv-card-stat{font-size:7px;color:#40dd40;}

.rN{border-color:#3a3a3a!important;}
.rR{border-color:#208020!important;}
.rE{border-color:#2020a0!important;}
.rL{border-color:#802080!important;}
.rM{border-color:#c0a020!important;background:linear-gradient(135deg,#141000,#1e1800)!important;}
.equip-confirm-btn{

  border:2px solid #40cc40;border-radius:6px;padding:9px;

}
.equip-confirm-btn:active{transform:scale(.97);}

/* ===== ガチャ召喚モーダル ===== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;
  display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{
  width:100%;max-width:480px;margin:0 auto;
  background:linear-gradient(180deg,#1a1208,#0d0c08);
  border-top:3px solid #c0a030;border-radius:16px 16px 0 0;
  padding:16px 12px 28px;transform:translateY(100%);transition:transform .3s;
  max-height:92dvh;overflow-y:auto;position:relative;
}
.overlay.open .sheet{transform:translateY(0);}
.sheet-title{font-size:16px;font-weight:900;color:#f0d890;text-align:center;margin-bottom:14px;}
.sheet-close{position:absolute;top:12px;right:14px;font-size:20px;cursor:pointer;color:#806040;}

.gacha-rate-info{font-size:9px;color:#706040;margin:6px 0 10px;}

.gacha-item-ico{font-size:28px;}
.gacha-call-btns{display:flex;gap:6px;}
.gacha-call-btn{

.ms-wrap{padding:6px;}

.mission-desc{font-size:9px;color:#706040;margin-top:1px;}
.mission-prog-txt{font-size:9px;margin-top:3px;}

.mission-prog-fill{height:100%;background:linear-gradient(90deg,#2060cc,#4088ff);border-radius:2px;}
.mission-reward{font-size:8px;color:#c0a030;margin-top:2px;}
.mission-claim-btn{
  background:linear-gradient(180deg,#c0a030,#806010);

  padding:5px 10px;font-size:10px;font-weight:900;color:#fff;cursor:pointer;flex-shrink:0;
}
.mission-claim-btn:active{transform:scale(.92);}
.mission-done-lbl{font-size:12px;color:#40aa20;font-weight:900;flex-shrink:0;}

/* ===== ステータス ===== */
.stat-wrap{padding:6px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.stat-card{
  background:linear-gradient(180deg,#1a1408,#120f06);
  border:1px solid #2a1808;border-radius:6px;padding:9px 10px;
}
.stat-card-lbl{font-size:9px;color:#706040;margin-bottom:3px;}
.stat-card-val{font-size:17px;font-weight:900;}
.c-atk{color:#ff5050;}.c-def{color:#5090ff;}.c-hp{color:#40dd40;}
.c-exp{color:#a080e0;}.c-gld{color:#f0c040;}.c-regen{color:#40ee80;}

/* ===== ログ ===== */
.log-wrap{padding:6px;}
.log-box{

}
.log-box::-webkit-scrollbar{width:3px;}

.log-n{color:#504030;}.log-d{color:#c0b090;}.log-c{color:#c080d0;}
.log-g{color:#f0d060;font-weight:700;}.log-k{color:#f0a030;}.log-l{color:#40dd40;}

.nav{

function getMissionProg(m) {
  switch(m.type) {
    case 'stage':      return Math.min(G.stage - 1, m.need);
    case 'upLv':       return Math.min(G.upLv[m.key] || 0, m.need);
    case 'lv':         return Math.min(G.lv, m.need);
    case 'gachaTotal': return Math.min(G.gachaTotal, m.need);
    case 'jobIdx':     return Math.min(G.jobIdx, m.need);
    case 'bossKill':   return Math.min(G.totalBossKills || 0, m.need);
    case 'critRate':   return Math.min(G.crits[0].rate, m.need);
    default: return 0;
  }
}

function buildMission() {
  var el = document.getElementById("pane-ms");
  if (!el) return;
  var statNm = {atk:"ATK",def:"DEF",hp:"HP",expR:"EXP倍率",goldR:"GOLD倍率"};
  var html = "<div class=\"ms-wrap\">";
  html += "<div class=\"ms-ticket-bar\">"
    + "<div style=\"font-size:9px;color:#408040;\">🎫 ダンジョンチケット</div>"
    + "<div class=\"ms-ticket-num\">" + (G.dungeonTickets || 0) + "</div>"
    + "</div>";
  MISSIONS.forEach(function(m) {
    var prog = getMissionProg(m);
    var isDone = prog >= m.need;
    var claimed = G.missionClaimed[m.id];
    var pct = Math.min(100, prog / m.need * 100);
    var rewardTxt = "💎" + m.reward.gem + (m.reward.ticket > 0 ? " 🎫×" + m.reward.ticket : "");
    html += "<div class=\"mission-card" + (claimed ? " claimed" : isDone ? " done" : "") + "\">"
      + "<div class=\"mission-ico\">" + m.ico + "</div>"
      + "<div class=\"mission-info\">"
      + "<div class=\"mission-nm\">" + m.nm + "</div>"
      + "<div class=\"mission-desc\">" + m.desc + "</div>"
      + "<div class=\"mission-prog-txt\"><b style=\"color:" + (isDone ? "#40dd40" : "#c0a030") + "\">" + prog + "</b>/" + m.need + "</div>"
      + "<div class=\"mission-prog-bar\"><div class=\"mission-prog-fill\" style=\"width:" + pct + "%\"></div></div>"
      + "<div class=\"mission-reward\">報酬: " + rewardTxt + "</div>"
      + "</div>";
    if (claimed) {
      html += "<div class=\"mission-done-lbl\">✓</div>";
    } else if (isDone) {
      html += "<button class=\"mission-claim-btn\" onclick=\"claimMission('" + m.id + "')\">受取</button>";
    }
    html += "</div>";
  });
  html += "</div>";
  el.innerHTML = html;
}

function claimMission(id) {
  if (G.missionClaimed[id]) return;
  var m = MISSIONS.find(function(x) { return x.id === id; });
  if (!m || getMissionProg(m) < m.need) return;
  G.missionClaimed[id] = true;
  G.gem += m.reward.gem;
  G.dungeonTickets = (G.dungeonTickets || 0) + m.reward.ticket;
  addLog('🏆 「' + m.nm + '」達成！ 💎+' + m.reward.gem + (m.reward.ticket > 0 ? ' 🎫+' + m.reward.ticket : ''), 'log-g');
  buildMission();
  renderBattle();
}

function checkMissions() {
  var el = document.getElementById('pane-ms');
  if (el && el.classList.contains('active')) buildMission();
}

// ===================== STAT CALC =====================
function jm() { return JOBS[G.jobIdx].mul; }

function skillBonus(eff) {
  var b = 0;
  SKILL_DEFS.forEach(function(s) { if(s.eff===eff) b += (G.skillLv[s.id]||0)*s.val; });
  return b;
}
function eqBonus(stat, base) {
  var flat = 0, pct = 0;
  ['weapon','armor','accessory'].forEach(function(k) {
    var eq = G.equipped[k];
    if(eq && eq.stat===stat) { flat += eq.v; pct += (eq.pct||0); }
  });
  return base ? Math.floor(base * pct) + flat : flat;
}
function petBonus(stat, base) {
  var flat = 0, pct = 0;
  G.equippedPets.forEach(function(p) {
    if(p && p.stat===stat) { flat += p.v * p.lv; pct += (p.pct||0) * p.lv; }
  });
  return base ? Math.floor(base * pct) + flat : flat;
}

function calcAtk()  { var base = Math.floor(( 10 + G.upLv.atk*5  + G.ptSt.atk*3) * jm().atk  * (1 + skillBonus('atk'))); return base + eqBonus('atk', base) + petBonus('atk', base); }
function calcDef()  { var base = Math.floor((  5 + G.upLv.def*3  + G.ptSt.def*2) * jm().def  * (1 + skillBonus('def'))); return base + eqBonus('def', base) + petBonus('def', base); }
function calcMaxHp(){ var base = Math.floor((100 + G.upLv.hp*30  + G.ptSt.hp*20) * jm().hp   * (1 + skillBonus('hp'))); return base + eqBonus('hp', base) + petBonus('hp', base); }
function calcHpRegen(){ return Math.floor((1 + G.upLv.hpR * 2) * jm().hp * (1 + skillBonus('hp') * 0.5)); }
function calcExpR() { return +((1 + G.upLv.expR*0.05  + eqBonus('expR')  + petBonus('expR'))  * jm().exp * (1 + skillBonus('exp'))).toFixed(2); }
function calcGoldR(){ return +((1 + G.upLv.goldR*0.05 + eqBonus('goldR') + petBonus('goldR')) * jm().gld * (1 + skillBonus('gld'))).toFixed(2); }

function fmt(n) {
  if(n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if(n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if(n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}
function expNeed(lv) { return Math.floor(80 * Math.pow(1.2, lv-1)); }
function upCost(lv)  { return Math.floor(50  * Math.pow(1.4, lv)); }
function rCost(lv)   { return Math.floor(100 * Math.pow(1.5, lv)); }
function mCost(lv)   { return Math.floor(150 * Math.pow(1.6, lv)); }

function spawnEnemy() {
  // 10の倍数ステージはボス
  if(G.stage % 10 === 0) {
    // 転職クエストに必要なボスを優先
    var needed = null;
    var curJob = JOBS[G.jobIdx];
    curJob.quests.forEach(function(q) {
      if(q.type==='boss' && (G.bossKills[q.boss]||0) < q.need) needed = q.boss;
    });
    G.eName = needed || BOSS_LIST[Math.floor(Math.random()*BOSS_LIST.length)];
    G.eIco  = '👹';
    G.eMax  = Math.floor(30 * Math.pow(1.15, G.stage-1) * 3);
    addLog('⚠ ボス【'+G.eName+'】が現れた！', 'log-c');
  } else {
    var suf = G.stage>=15?'王':G.stage>=8?'長':'';
    var idx = Math.floor(Math.random()*ENEMY_NAMES.length);
    G.eName = ENEMY_NAMES[idx] + suf;
    G.eIco  = ENEMY_ICOS[idx];
    G.eMax  = Math.floor(30 * Math.pow(1.15, G.stage-1));
  }
  G.eHp = G.eMax;
  document.getElementById('eSprite').textContent = G.eIco;
  document.getElementById('eNametag').textContent = G.eName;
}

// ===================== CRIT =====================
function doCrit(baseAtk) {
  // デフォルトクリティカル(100%到達した最上位)
  var defCrit = null;
  for(var i = G.crits.length-1; i >= 0; i--) {
    if(G.crits[i].rate >= 100) { defCrit = G.crits[i]; break; }
  }
  var applied = defCrit;
  var startIdx = defCrit ? G.crits.indexOf(defCrit)+1 : 0;
  for(var j = G.crits.length-1; j >= startIdx; j--) {
    if(Math.random()*100 < G.crits[j].rate) { applied = G.crits[j]; break; }
  }
  var mul = applied ? applied.mul : 1.0;
  // スキルクリ率ボーナス（クリ率全体に加算）
  var critBonus = skillBonus('critB');
  if(!applied && critBonus > 0 && Math.random()*100 < critBonus) {
    applied = G.crits[0]; mul = G.crits[0].mul;
  }
  var dmg = Math.max(1, Math.floor(baseAtk * mul) - Math.floor(calcDef() * 0.3));
  return {dmg:dmg, crit:applied};
}

function showDmgPop(dmg, crit, isPlayer) {
  var area = document.getElementById('battleArea');
  var el = document.createElement('div');
  el.className = 'dmg-pop';
  var sz = crit ? 16 + G.crits.indexOf(crit)*3 : 14;
  var col = crit ? crit.col : (isPlayer ? '#ffffff' : '#ff6666');
  var x = isPlayer ? '65%' : '30%';
  el.style.cssText = 'font-size:'+sz+'px;color:'+col+';left:'+x+';top:38%;';
  el.textContent = (isPlayer?'':'-') + fmt(dmg) + (crit ? ' '+crit.name.replace('クリティカル','⚡') : '');
  area.appendChild(el);
  setTimeout(function(){ el.remove(); }, 900);
}
function showGainPop(gold, exp) {
  var area = document.getElementById('battleArea');
  [['🪙+'+fmt(gold), '#e8c84a', '80px'], ['✨+'+fmt(exp), '#88ccff', '60px']].forEach(function(item) {
    var el = document.createElement('div');
    el.className = 'gain-pop';
    el.style.cssText = 'color:'+item[1]+';right:14px;bottom:'+item[2]+';';
    el.textContent = item[0];
    area.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1200);
  });
}

// ===================== BATTLE TICK =====================
function battleTick() {
  if(G.eHp <= 0) spawnEnemy();

  // HP自動回復
  var regen = calcHpRegen();
  G.hp = Math.min(calcMaxHp(), G.hp + regen);

  // プレイヤー攻撃
  var res = doCrit(calcAtk());
  G.eHp = Math.max(0, G.eHp - res.dmg);
  showDmgPop(res.dmg, res.crit, true);
  var cls = !res.crit ? 'log-d' : (res.crit === G.crits[4] ? 'log-g' : 'log-c');
  addLog(G.eName+'に '+fmt(res.dmg)+(res.crit?'【'+res.crit.name+'】':''), cls);

  // 敵撃破
  if(G.eHp <= 0) {
    // ボス討伐チェック
    BOSS_LIST.forEach(function(b) { if(G.eName===b) { G.bossKills[b] = (G.bossKills[b]||0)+1; G.totalBossKills = (G.totalBossKills||0)+1; G.totalBossKills = (G.totalBossKills||0)+1; addLog('💀 '+b+' 討伐！','log-c'); }}); checkMissions();
    var gGain = Math.floor((G.stage*10 + Math.random()*G.stage*5) * calcGoldR());
    var eGain  = Math.floor(G.stage * 40 * calcExpR());
    G.gold += gGain;
    G.gem  += 10;
    G.hp = calcMaxHp(); // ステージクリアで全回復
    addExp(eGain);
    showGainPop(gGain, eGain);
    addLog(G.eName+'撃破！ +'+fmt(gGain)+'G +'+fmt(eGain)+'EXP +💎10', 'log-k');
    G.stage++;
    checkMissions();
    spawnEnemy();
  } else {
    // 敵攻撃
    var eDmg = Math.max(1, Math.floor(G.eMax * 0.06) - Math.floor(calcDef() * 0.4));
    G.hp = Math.max(0, G.hp - eDmg);
    showDmgPop(eDmg, null, false);
    if(G.hp <= 0) {
      addLog('💀 倒された...1ステージ後退', 'log-n');
      G.stage = Math.max(1, G.stage - 1);
      G.hp = calcMaxHp(); // 全回復
      spawnEnemy();
    }
  }

  // ペット自動攻撃（3秒ごと、tickが3の倍数）
  // → setIntervalで別処理

  renderBattle();
}

function addExp(e) {
  G.exp += e;
  while(G.exp >= expNeed(G.lv)) {
    G.exp -= expNeed(G.lv);
    G.lv++;
    G.pt += 3;
    G.hp = calcMaxHp();
    if(G.lv % 10 === 0) { G.skillPt++; addLog('⚡スキルPt+1（Lv'+G.lv+'）','log-l'); }
    addLog('Lv'+G.lv+'！ Pt+3', 'log-l');
  }
}

function addLog(msg, cls) {
  var box = document.getElementById('logBox');
  var p = document.createElement('p');
  p.className = cls || 'log-n';
  p.textContent = msg;
  box.appendChild(p);
  if(box.children.length > 100) box.removeChild(box.firstChild);
  if(document.getElementById('pane-lg').classList.contains('active')) box.scrollTop = box.scrollHeight;
}

// ===================== RENDER =====================
function renderBattle() {
  var mhp = calcMaxHp();
  if(G.hp > mhp) G.hp = mhp;
  var en  = expNeed(G.lv);
  var epct = Math.min(100, G.exp/en*100);

  document.getElementById('tLv').textContent    = G.lv;
  document.getElementById('tExpBar').style.width = epct+'%';
  document.getElementById('tGold').textContent  = fmt(G.gold);
  document.getElementById('tGem').textContent   = G.gem;
  document.getElementById('sLv').textContent    = G.lv;
  document.getElementById('sPt').textContent    = G.pt;
  document.getElementById('stageLbl').textContent = 'STAGE '+G.stage;
  document.getElementById('jobLbl').textContent  = JOBS[G.jobIdx].ico+' '+JOBS[G.jobIdx].name+' ▶';

  // 敵HP
  var epct2 = G.eMax>0 ? G.eHp/G.eMax*100 : 0;
  document.getElementById('eHpBar').style.width  = epct2+'%';
  document.getElementById('eHpTxt').textContent  = fmt(G.eHp)+'/'+fmt(G.eMax);
  document.getElementById('eHpMini').style.width = epct2+'%';

  // プレイヤーHP
  var ppct = mhp>0 ? G.hp/mhp*100 : 0;
  document.getElementById('pHpMini').style.width = ppct+'%';
  document.getElementById('pHpBar').style.width  = ppct+'%';
  document.getElementById('pHpTxt').textContent  = fmt(G.hp)+'/'+fmt(mhp);
  document.getElementById('pExpBar').style.width = epct+'%';
  document.getElementById('pExpTxt').textContent = fmt(G.exp)+'/'+fmt(en);
}

// ===================== IDLE =====================
function updateIdleGold() {
  var sec = Math.min((Date.now()-G.lastTime)/1000, 43200);
  return Math.floor(sec * (calcAtk()*0.5 + G.stage*2) * calcGoldR());
}

var UP_DEFS = [

  {k:'expR', ico:'✨', bg:'#1a102a', nm:'EXP倍率',   cur:function(){return '×'+calcExpR();}, nxt:function(){return '+';}},
  {k:'goldR',ico:'🪙', bg:'#2a1a00', nm:'GOLD倍率',  cur:function(){return '×'+calcGoldR();},nxt:function(){return '+';}},
  {k:'hpR',  ico:'💚', bg:'#0a2a0a', nm:'HP回復速度', cur:function(){return '+'+calcHpRegen()+'/秒';},nxt:function(){return '+';}},,
];
function buildUp() {
  var ig = updateIdleGold();
  var en = expNeed(G.lv);

  var html = "<div class=\"enhance-wrap\">";

    + "<div class=\"levelup-avatar\">🧙</div>"
    + "<div class=\"levelup-info\">"

    + "<div class=\"levelup-exptext\">EXP " + fmt(G.exp) + " / " + fmt(en) + "</div>"

    + "<button class=\"levelup-btn off\" disabled>LEVEL UP!</button>"

  html += "<div class=\"idle-banner\">"
    + "<div class=\"idle-info\"><div class=\"idle-gold-amt\">+" + fmt(ig) + " G</div><div class=\"idle-sub\">放置収益（最大12時間）</div></div>"

  UP_DEFS.forEach(function(u) {

    var cost = upCost(lv);
    var can = G.gold >= cost;

    if(u.k==="hp")    nxtVal = fmt(Math.floor((100+(lv+1)*30)*jm().hp)) + " HP";
    else if(u.k==="atk")   nxtVal = "+" + ((lv+1)*5) + " ATK";
    else if(u.k==="def")   nxtVal = "+" + ((lv+1)*3) + " DEF";
    else if(u.k==="expR")  nxtVal = "×" + ((1+(lv+1)*0.05).toFixed(2));
    else if(u.k==="goldR") nxtVal = "×" + ((1+(lv+1)*0.05).toFixed(2));
    else if(u.k==="hpR")   nxtVal = "+" + (1+(lv+1)*2) + "/秒";

      + "<div class=\"enh-change\">" + u.cur() + " → " + nxtVal + "</div>"
      + "</div>"
      + "<button class=\"enh-btn" + (can ? "" : " off") + "\" onclick=\"doUp('" + u.k + "')\" " + (can ? "" : "disabled") + ">"
      + "<span class=\"enh-btn-coin\">🪙</span>"
      + "<span class=\"enh-btn-cost\">" + fmt(cost) + "</span>"
      + "</button>"
      + "</div>";
  });
  html += "</div>";
  document.getElementById("pane-up").innerHTML = html;
}
function doUp(k) {
  var cost = upCost(G.upLv[k]);
  if(G.gold < cost) return;
  G.gold -= cost; G.upLv[k]++;
  buildUp(); renderBattle();
}
function claimIdle() {
  var ig = updateIdleGold();
  G.gold += ig;
  G.lastTime = Date.now();
  addLog('放置収益 G+'+fmt(ig)+'！', 'log-k');
  buildUp(); renderBattle();
}

// ===================== BUILD CRIT =====================
function buildCrit() {
  var defIdx = -1;
  for(var i=G.crits.length-1;i>=0;i--){ if(G.crits[i].rate>=100){defIdx=i;break;} }
  var html = '<div class="crit-wrap"><div class="crit-info-txt">発動率100%でデフォルト化。さらに上を目指せ！</div>';
  G.crits.forEach(function(c, i) {
    var isDef = i===defIdx;
    var locked = i>0 && G.crits[i-1].rate < 10;
    var rc = rCost(c.rateLv), mc = mCost(c.mulLv);
    var canR = !locked && G.gold>=rc && c.rate<100;
    var canM = !locked && G.gold>=mc;
    html += '<div class="crit-row'+(isDef?' def-active':'')+'" style="'+(isDef?'border-color:'+c.col:'')+'">'
      + '<div class="crit-dot" style="background:'+c.col+'"></div>'
      + '<div class="crit-mid">'
      + '<div class="crit-name" style="color:'+c.col+'">'
      + c.name
      + (isDef ? '<span class="def-badge">DEFAULT</span>' : '')
      + (locked ? '<span class="lock-badge">🔒</span>' : '')
      + '</div>'
      + '<div class="crit-stat">率: '+c.rate.toFixed(1)+'%  倍率: ×'+c.mul.toFixed(1)+'</div>'
      + '<div class="crit-rbar-bg"><div class="crit-rbar-fill" style="width:'+c.rate+'%;background:'+c.col+'"></div></div>'
      + '</div>'
      + '<div class="crit-btns">'
      + '<button class="sm-btn'+(canR?'':' off')+'" onclick="upCritR('+i+')" '+(canR?'':'disabled')+'>'
      + '率UP<span class="sm-btn-cost">🪙'+fmt(rc)+'</span></button>'
      + '<button class="sm-btn'+(canM?'':' off')+'" onclick="upCritM('+i+')" '+(canM?'':'disabled')+'>'
      + '威力UP<span class="sm-btn-cost">🪙'+fmt(mc)+'</span></button>'
      + '</div></div>';
  });
  html += '</div>';
  document.getElementById('pane-cr').innerHTML = html;
}
function upCritR(i) {
  var c=G.crits[i]; if(c.rate>=100) return;
  var cost=rCost(c.rateLv); if(G.gold<cost) return;
  G.gold-=cost; c.rateLv++; c.rate=+(Math.min(100,c.rate+0.1)).toFixed(1);
  buildCrit(); renderBattle();
}
function upCritM(i) {
  var c=G.crits[i];
  var cost=mCost(c.mulLv); if(G.gold<cost) return;
  G.gold-=cost; c.mulLv++; c.mul=+(c.mul+0.2).toFixed(1);
  buildCrit(); renderBattle();
}

function buildSkill() {
  var html = '<div class="skill-wrap"><div class="skill-pt-head">'
    + '<div><div style="font-size:9px;color:var(--text2)">スキルポイント</div>'
    + '<div class="skill-pt-num">'+G.skillPt+'</div></div>'
    + '<div style="font-size:9px;color:var(--text2);text-align:right">転職時+5pt<br>Lv10毎+1pt</div></div>';
  ['攻撃','防御','収益'].forEach(function(cat) {
    html += '<div class="skill-cat-title">⚡ '+cat+'系スキル</div><div class="skill-grid">';
    SKILL_DEFS.filter(function(s){return s.cat===cat;}).forEach(function(s) {
      var lv = G.skillLv[s.id]||0;
      var maxed = lv>=s.maxLv;
      var unlocked = !s.req || (G.skillLv[s.req]||0)>=1;
      var can = G.skillPt>=s.cost && !maxed && unlocked;
      var cls = maxed?'maxed':lv>0?'on':unlocked?'':'locked';
      html += '<div class="skill-node '+cls+'" onclick="doSkill(' + s.id + ')">'
        + '<div class="skill-node-ico">'+s.ico+'</div>'
        + '<div class="skill-node-nm">'+s.name+'</div>'
        + '<div class="skill-node-desc">'+s.desc+'</div>'
        + '<div class="skill-node-lv">'+(maxed?'MAX':'Lv'+lv+'/'+s.maxLv)+' Pt×'+s.cost+'</div>'
        + '</div>';
    });
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('pane-sk').innerHTML = html;
}
function doSkill(id) {
  var s = SKILL_DEFS.find(function(x){return x.id===id;});
  if(!s) return;
  if(s.req && !(G.skillLv[s.req]||0)) return;
  if((G.skillLv[s.id]||0)>=s.maxLv) return;
  if(G.skillPt < s.cost) return;
  G.skillPt -= s.cost;
  G.skillLv[s.id] = (G.skillLv[s.id]||0)+1;
  addLog(s.name+' Lv'+G.skillLv[s.id]+'！','log-l');
  buildSkill(); renderBattle();
}

  if(!G._selPet||G._selPetSlot===null) return;
  G.equippedPets[G._selPetSlot]=G._selPet;

function doPetGacha() {
  if(G.gem<50){ addLog('💎が足りない！(ペットガチャ:50)','log-n'); return; }
  G.gem-=50;
  var rar = rollRarity();
  var ri = RARITY.indexOf(rar);
  var base = PETS[Math.min(ri*2+Math.floor(Math.random()*2), PETS.length-1)];
  var pet = Object.assign({}, base, {rar:rar, lv:ri+1, uid:Date.now()+Math.random()});
  G.petInv.push(pet);
  addLog('🐾 '+pet.name+'【'+pet.rar.name+'】獲得！','log-k');
  buildPet(); renderBattle();
}

// ===================== GACHA =====================
var GACHA_LV_NEED = 10, GACHA_LV_MAX = 20;
function getGachaRates(glv) {
  var rates = {N:55,R:30,E:14,L:0,M:0};
  if(glv>=6)  { rates.L=(glv-5)*0.8; rates.N=Math.max(5,rates.N-1); }
  if(glv>=11) { rates.M=(glv-10)*0.3; }
  var bonus = Math.min(glv-1,10);
  rates.N = Math.max(5, rates.N - bonus*1.5);
  rates.R = Math.min(45, rates.R + bonus*0.8);
  rates.E = Math.min(30, rates.E + bonus*0.5);
  var total = rates.N+rates.R+rates.E+rates.L+rates.M;
  Object.keys(rates).forEach(function(k){ rates[k]=rates[k]/total*100; });
  return rates;
}
function rollRarity() {
  var rates = getGachaRates(G.gachaLv);
  var r = Math.random()*100, acc=0;
  for(var i=0;i<RARITY.length;i++) {
    if(RARITY[i].unlockLv > G.gachaLv) continue;
    acc += rates[RARITY[i].id];
    if(r < acc) return RARITY[i];
  }
  return RARITY[0];
}
function rollItem() {
  G.gachaTotal++; G.gachaExp++;
  if(G.gachaExp >= GACHA_LV_NEED && G.gachaLv < GACHA_LV_MAX) {
    G.gachaExp=0; G.gachaLv++;
    if(G.gachaLv===6)  addLog('🎉 レジェンドが解放！','log-g');
    if(G.gachaLv===11) addLog('🎉 ミシックが解放！','log-g');
  }
  var rar = rollRarity();
  var ri = RARITY.indexOf(rar);
  var slotKeys = Object.keys(ITEMS);
  var slot = slotKeys[Math.floor(Math.random()*slotKeys.length)];
  var pool = ITEMS[slot];
  var base = pool[Math.min(ri, pool.length-1)];
  return Object.assign({}, base, {rar:rar, slot:slot, uid:Date.now()+Math.random()});
}
function doGacha(n, forceSlot) {
  var cost=30*n;
  if(G.gem<cost){ addLog('💎が足りない！','log-n'); return; }
  G.gem-=cost;
  var results=[];
  for(var i=0;i<n;i++) {
    var item = rollItem();
    if(forceSlot) item.slot = forceSlot;
    results.push(item);
  }
  G.inventory.push.apply(G.inventory, results);
  var show=results.slice(-10);
  var el=document.getElementById('gResult');
  el.innerHTML='';
  show.forEach(function(item,i) {
    setTimeout(function(){
      var c=document.createElement('div');
      c.className='r-card r'+item.rar.id;
      c.innerHTML='<div class="r-card-ico">'+item.ico+'</div>'
        +'<div class="r-card-rar">'+item.rar.name+'</div>'
        +'<div class="r-card-nm">'+item.name+'</div>';
      el.appendChild(c);
    }, i*80);
  });
  results.filter(function(r){return r.rar.id==='M';}).forEach(function(r){ addLog('🎉 '+r.name+' [ミシック]獲得！','log-g'); });
  updateGachaLv(); renderBattle();
}
function updateGachaLv() {
  var pct=G.gachaExp/GACHA_LV_NEED*100;
  document.getElementById('gLvNum').textContent=G.gachaLv;
  document.getElementById('gLvBar').style.width=pct+'%';
  document.getElementById('gTotal').textContent=G.gachaTotal;
  var left=GACHA_LV_NEED-G.gachaExp;
  document.getElementById('gLvInfo').textContent=G.gachaLv>=GACHA_LV_MAX?'MAX！':'次のLvまで: '+left+'回';
  var rates=getGachaRates(G.gachaLv);
  var info=RARITY.filter(function(r){return r.unlockLv<=G.gachaLv;}).map(function(r){return r.name+':'+rates[r.id].toFixed(1)+'%';}).join('  ');
  document.getElementById('gRateInfo').textContent=info;
}
function openGacha() { updateGachaLv(); document.getElementById('gResult').innerHTML=''; document.getElementById('gachaOverlay').classList.add('open'); }
function closeGacha() { document.getElementById('gachaOverlay').classList.remove('open'); }

}
function doTransfer() {
  var next=JOBS[G.jobIdx+1]; if(!next) return;
  var cur=JOBS[G.jobIdx];
  var progs=cur.quests.map(function(q){
    return q.type==='stage'?G.stage-1>=q.need:(G.bossKills[q.boss]||0)>=q.need;
  });
  if(!progs.every(Boolean)) return;
  G.jobIdx++;
  G.skillPt+=5;
  G.hp=calcMaxHp();
  addLog('🎉 【'+next.name+'】に昇級！ スキルPt+5','log-g');
  buildPromo(); renderBattle();
}

// ===================== SAVE / LOAD =====================
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      gold:G.gold, gem:G.gem, lv:G.lv, exp:G.exp, pt:G.pt, skillPt:G.skillPt,
      hp:G.hp, stage:G.stage, lastTime:Date.now(),
      upLv:G.upLv, ptSt:G.ptSt, skillLv:G.skillLv,
      crits:G.crits.map(function(c){return {rate:c.rate,mul:c.mul,rateLv:c.rateLv,mulLv:c.mulLv};}),
      jobIdx:G.jobIdx, bossKills:G.bossKills,
      gachaLv:G.gachaLv, gachaExp:G.gachaExp, gachaTotal:G.gachaTotal,
      inventory:G.inventory, equipped:G.equipped,
      missionClaimed:G.missionClaimed, dungeonTickets:G.dungeonTickets, totalBossKills:G.totalBossKills||0,
      petInv:G.petInv, equippedPets:G.equippedPets,
      missionClaimed:G.missionClaimed, dungeonTickets:G.dungeonTickets, totalBossKills:G.totalBossKills||0,
    }));
  } catch(e) {}
}
function loadGame() {
  try {
    var raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    var d=JSON.parse(raw);
    G.gold=d.gold||0; G.gem=d.gem||0; G.lv=d.lv||1; G.exp=d.exp||0;
    G.pt=d.pt||0; G.skillPt=d.skillPt||0;
    G.stage=d.stage||1; G.lastTime=d.lastTime||Date.now();
    if(d.upLv) G.upLv=d.upLv;
    if(d.ptSt) G.ptSt=d.ptSt;
    if(d.skillLv) G.skillLv=d.skillLv;
    if(d.crits) d.crits.forEach(function(s,i){ if(G.crits[i]) Object.assign(G.crits[i],s); });
    G.jobIdx=d.jobIdx||0; G.bossKills=d.bossKills||{};
    G.gachaLv=d.gachaLv||1; G.gachaExp=d.gachaExp||0; G.gachaTotal=d.gachaTotal||0;
    G.inventory=d.inventory||[]; G.equipped=d.equipped||{weapon:null,armor:null,accessory:null};
    G.petInv=d.petInv||[]; G.equippedPets=d.equippedPets||[null,null];
    G.missionClaimed=d.missionClaimed||{}; G.dungeonTickets=d.dungeonTickets||0; G.totalBossKills=d.totalBossKills||0;
    G.missionClaimed=d.missionClaimed||{}; G.dungeonTickets=d.dungeonTickets||0; G.totalBossKills=d.totalBossKills||0;
    addLog('💾 セーブデータ読み込み完了','log-k');
  } catch(e) { addLog('セーブデータ読み込み失敗','log-n'); }
}

// ===================== PET AUTO ATTACK =====================
var petTickCount=0;
setInterval(function(){
  petTickCount++;
  if(petTickCount%3!==0 || G.eHp<=0) return;
  var pb=petBonus('atk'); if(pb<=0) return;
  G.eHp=Math.max(0,G.eHp-pb);
  var area=document.getElementById('battleArea');
  var el=document.createElement('div');
  el.className='dmg-pop';
  el.style.cssText='font-size:11px;color:#88ddff;right:20%;top:50%;';
  el.textContent='🐾'+pb;
  area.appendChild(el);
  setTimeout(function(){el.remove();},900);
  renderBattle();
},1000);

function init() {
  loadGame();
  G.hp = calcMaxHp();
  spawnEnemy();
  buildUp();
  buildPromo();
  renderBattle();
  addLog('冒険が始まった！','log-k');
  setInterval(battleTick, 1000);
  setInterval(saveGame, 10000);
  setInterval(function(){ if(document.getElementById('pane-up').classList.contains('active')) buildUp(); }, 5000);
}
init();
