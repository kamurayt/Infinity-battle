<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>神をも超えし者</title>
<style>
:root{
  --bg:#1a1a2e;--panel:#1e1e2e;--panel2:#252535;--panel3:#2e2e45;
  --border:#3a3a5a;--border2:#4a4a6a;
  --accent:#e8c84a;--accent2:#f5dd7a;
  --red:#e05050;--red2:#ff6060;
  --green:#4cd080;--blue:#5090e0;--purple:#a060e0;
  --gold:#e8c84a;--goldBtn:#c8a030;
  --text:#e8e8f8;--text2:#9090b0;--text3:#6060808;
  --c1:#7ddf64;--c2:#64b5f6;--c3:#ce93d8;--c4:#ffb74d;--c5:#fff176;
  --hp-bar:#e04040;--exp-bar:#4488dd;--enemy-bar:#dd3333;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{
  display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  font-size:13px;
  max-width:480px;margin:0 auto;
  height:100dvh;
}

/* ===== TOP NAV ===== */
.topnav{
  background:#111122;
  border-bottom:1px solid #2a2a4a;
  padding:5px 8px;
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;height:36px;
}
.avatar{
  width:26px;height:26px;border-radius:4px;
  background:linear-gradient(135deg,#3a3a6a,#5a5a9a);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  border:1px solid #5a5aaa;flex-shrink:0;
}
.lv-badge{
  font-size:9px;color:var(--text2);
}
.lv-badge strong{color:var(--accent);font-size:12px;}
.exp-mini{
  flex:1;height:6px;background:#1a1a3a;border-radius:3px;overflow:hidden;
  border:1px solid #2a2a4a;
}
.exp-mini-fill{height:100%;background:linear-gradient(90deg,#3366cc,#5588ee);border-radius:3px;transition:width .3s;}
.res-row{display:flex;gap:6px;margin-left:auto;}
.res-chip{
  display:flex;align-items:center;gap:3px;
  background:#1a1a3a;border:1px solid #3a3a6a;
  border-radius:12px;padding:2px 8px;
  font-size:11px;font-weight:700;
}
.res-chip.gold-chip{color:var(--gold);}
.res-chip.gem-chip{color:#b39ddb;}
.top-icons{display:flex;gap:4px;}
.top-icon{width:24px;height:24px;background:#1a1a3a;border:1px solid #3a3a6a;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}

/* ===== BATTLE SCENE ===== */
.battle-scene{
  flex:1 1 0;min-height:0;
  background:linear-gradient(180deg,#0d1a2e 0%,#0a1520 40%,#060d15 100%);
  position:relative;overflow:hidden;
}

/* 背景レイヤー */
.bg-layer{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 30% at 50% 80%, rgba(20,40,80,0.5), transparent),
    linear-gradient(180deg,#0d1a2e,#060d15);
}
.bg-trees{
  position:absolute;bottom:0;left:0;right:0;height:50%;
  background:linear-gradient(0deg,rgba(5,15,30,0.9) 0%,transparent 100%);
}

/* ステージ表示 */
.stage-info{
  position:absolute;top:6px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:8px;
  z-index:5;
}
.stage-txt{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:4px;padding:2px 10px;
  font-size:10px;color:rgba(255,255,255,0.7);
  letter-spacing:1px;
}
.mail-icon{
  position:absolute;right:8px;top:4px;
  background:rgba(0,0,0,0.5);border:1px solid #3a3a6a;
  border-radius:4px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;font-size:12px;
}

/* 敵HPバー（上部） */
.enemy-hp-area{
  position:absolute;top:32px;left:12px;right:12px;
  z-index:5;
}
.enemy-hp-bar-bg{
  height:12px;background:#1a0808;border:1px solid #5a2020;border-radius:6px;overflow:hidden;
}
.enemy-hp-bar-fill{
  height:100%;background:linear-gradient(90deg,#991a1a,#dd3333);
  border-radius:6px;transition:width .25s;
}
.enemy-hp-txt{
  font-size:9px;color:rgba(255,255,255,0.5);text-align:center;margin-top:2px;
}

/* 戦闘キャラ */
.battle-chars{
  position:absolute;
  bottom:50px;left:0;right:0;
  display:flex;align-items:flex-end;
  justify-content:space-around;
  padding:0 20px;
  z-index:4;
}
.player-char{
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.char-sprite{
  font-size:44px;
  filter:drop-shadow(0 4px 8px rgba(80,144,224,0.4));
  animation:charIdle 1.5s ease-in-out infinite;
}
@keyframes charIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.char-name-tag{
  background:rgba(80,144,224,0.3);border:1px solid rgba(80,144,224,0.5);
  border-radius:10px;padding:1px 8px;font-size:9px;color:#aaccff;
}
.char-hp-bar-mini{width:60px;height:5px;background:#1a1a3a;border-radius:3px;overflow:hidden;}
.char-hp-fill{height:100%;background:linear-gradient(90deg,#2a8a2a,#4cd080);border-radius:3px;}

.enemy-char{
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.enemy-sprite{
  font-size:48px;
  filter:drop-shadow(0 4px 8px rgba(224,80,80,0.4));
  animation:enemyWalk .8s ease-in-out infinite;
}
@keyframes enemyWalk{0%,100%{transform:translateX(0) scaleX(-1)}50%{transform:translateX(-4px) scaleX(-1)}}
.enemy-name-tag{
  background:rgba(224,80,80,0.3);border:1px solid rgba(224,80,80,0.5);
  border-radius:10px;padding:1px 8px;font-size:9px;color:#ffaaaa;
}
.enemy-hp-bar-char{width:70px;height:5px;background:#2a0a0a;border-radius:3px;overflow:hidden;}
.enemy-hp-fill-char{height:100%;background:linear-gradient(90deg,#881a1a,#dd3333);border-radius:3px;transition:width .25s;}

/* ダメージ数字 */
.dmg-num{
  position:absolute;
  font-weight:900;
  pointer-events:none;
  animation:dmgAnim .9s ease-out forwards;
  z-index:10;
  text-shadow:0 2px 8px rgba(0,0,0,0.9),-1px -1px 0 rgba(0,0,0,0.8);
}
@keyframes dmgAnim{
  0%{opacity:1;transform:translate(-50%,0) scale(1.2);}
  30%{transform:translate(-50%,-30px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-80px) scale(0.8);}
}

/* 収益ポップ */
.gain-pop{
  position:absolute;right:14px;
  font-size:11px;font-weight:700;
  animation:gainAnim 1.2s ease-out forwards;
  z-index:8;pointer-events:none;
}
@keyframes gainAnim{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}

/* 地面ライン */
.ground-line{
  position:absolute;bottom:45px;left:0;right:0;
  height:2px;background:linear-gradient(90deg,transparent,rgba(60,80,120,0.5),transparent);
}

/* 底部情報バー（scene内） */
.scene-bottom{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(10,10,25,0.85);
  border-top:1px solid rgba(60,60,100,0.5);
  padding:4px 10px;
  display:flex;align-items:center;gap:8px;
  z-index:6;
}
.scene-lv{font-size:11px;color:var(--text2);}
.scene-lv strong{color:var(--accent);font-size:13px;}
.scene-bars{flex:1;display:flex;flex-direction:column;gap:2px;}
.scene-bar-row{display:flex;align-items:center;gap:4px;}
.scene-bar-lbl{font-size:8px;color:var(--text2);width:16px;}
.scene-bar-bg{flex:1;height:6px;background:#0a0a1a;border-radius:3px;overflow:hidden;border:1px solid #2a2a4a;}
.scene-bar-fill{height:100%;border-radius:3px;transition:width .3s;}
.scene-bar-fill.hp{background:linear-gradient(90deg,#aa2222,#ee4444);}
.scene-bar-fill.exp{background:linear-gradient(90deg,#2255aa,#4488ee);}
.scene-bar-val{font-size:8px;color:var(--text2);width:50px;text-align:right;}

/* ===== BOTTOM PANEL ===== */
.bottom-panel{
  background:var(--panel);
  border-top:2px solid #3a3a6a;
  flex-shrink:0;
  display:flex;flex-direction:column;
  height:48%;min-height:0;
}

/* タブ */
.tabs{
  display:flex;background:#16162a;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.tab{
  flex:1;padding:7px 2px;
  font-size:10px;font-weight:700;
  color:var(--text2);text-align:center;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .15s;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.panel-body{flex:1;overflow-y:auto;min-height:0;}
.panel-body::-webkit-scrollbar{width:3px;}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);}

.tab-content{display:none;}
.tab-content.active{display:block;}

/* ===== 強化リスト（スレイヤーレジェンド風縦リスト） ===== */
.upgrade-list{padding:6px 8px;display:flex;flex-direction:column;gap:5px;}

.up-row{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  display:flex;align-items:center;gap:10px;
}
.up-icon{
  width:40px;height:40px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
  border:1px solid var(--border2);
}
.up-center{flex:1;min-width:0;}
.up-name{font-size:12px;font-weight:700;margin-bottom:2px;}
.up-lv-row{display:flex;align-items:center;gap:6px;}
.up-lv-txt{font-size:10px;color:var(--text2);}
.up-arrow{font-size:9px;color:var(--text2);}
.up-next{font-size:10px;color:var(--green);}
.up-bar-bg{height:4px;background:#0a0a1a;border-radius:2px;overflow:hidden;margin-top:4px;border:1px solid #1a1a3a;}
.up-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),#88bbff);border-radius:2px;}
.up-right{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
.gold-btn{
  background:radial-gradient(circle at 40% 35%,#f5dd7a,#c8a030);
  border:none;border-radius:50%;
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;
  box-shadow:0 2px 8px rgba(200,160,48,0.4);
  font-size:12px;font-weight:900;color:#5a3a00;
  flex-direction:column;line-height:1.1;
}
.gold-btn:active{transform:scale(0.9);}
.gold-btn.off{opacity:0.3;cursor:not-allowed;box-shadow:none;}
.gold-btn-cost{font-size:7px;color:#5a3a00;font-weight:700;}

/* LEVEL UP ボタン */
.levelup-area{
  padding:6px 8px;
}
.levelup-btn{
  width:100%;
  background:linear-gradient(135deg,#3a8a3a,#5ab05a);
  border:none;border-radius:8px;
  padding:10px;
  font-size:13px;font-weight:900;color:#fff;
  cursor:pointer;transition:all .12s;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 10px rgba(60,160,60,0.3);
}
.levelup-btn:active{transform:scale(0.97);}
.levelup-btn.off{background:linear-gradient(135deg,#2a3a2a,#3a4a3a);opacity:0.5;cursor:not-allowed;box-shadow:none;}
.lv-btn-left{display:flex;flex-direction:column;align-items:flex-start;gap:1px;}
.lv-btn-lv{font-size:11px;color:rgba(255,255,255,0.7);}
.lv-btn-bar{width:120px;height:5px;background:rgba(0,0,0,0.3);border-radius:3px;overflow:hidden;margin-top:3px;}
.lv-btn-bar-fill{height:100%;background:rgba(255,255,255,0.6);border-radius:3px;transition:width .3s;}
.lv-btn-right{font-size:16px;font-weight:900;letter-spacing:1px;}

/* ===== クリティカルリスト ===== */
.crit-list{padding:6px 8px;display:flex;flex-direction:column;gap:5px;}
.crit-row{
  background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;
  display:flex;align-items:center;gap:8px;
}
.crit-row.is-default{border-color:var(--accent);}
.crit-icon{
  width:36px;height:36px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  border:1px solid var(--border2);
}
.crit-mid{flex:1;min-width:0;}
.crit-nm{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;}
.crit-badge{font-size:7px;background:var(--accent);color:#000;border-radius:3px;padding:1px 4px;font-weight:900;}
.crit-lock{font-size:9px;color:var(--text2);}
.crit-stats{font-size:9px;color:var(--text2);margin-top:2px;}
.crit-rate-bar{height:4px;background:#0a0a1a;border-radius:2px;overflow:hidden;margin-top:4px;border:1px solid #1a1a3a;}
.crit-rate-fill{height:100%;border-radius:2px;transition:width .3s;}
.crit-btns{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.sm-btn{
  background:var(--panel3);border:1px solid var(--border2);
  border-radius:5px;padding:4px 8px;
  font-size:9px;color:var(--text);cursor:pointer;
  white-space:nowrap;transition:all .12s;
  display:flex;flex-direction:column;align-items:center;
}
.sm-btn:active{transform:scale(0.9);}
.sm-btn.off{opacity:0.25;cursor:not-allowed;}
.sm-btn-cost{font-size:7px;color:var(--accent);}

/* ===== Lv振り分け ===== */
.pt-section{padding:6px 8px;}
.pt-header-card{
  background:var(--panel2);border:1px solid #3a5a3a;border-radius:8px;
  padding:10px 12px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.pt-num{font-size:28px;font-weight:900;color:var(--green);}
.pt-sub{font-size:9px;color:var(--text2);}
.pt-list{display:flex;flex-direction:column;gap:5px;}
.pt-row{
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:all .12s;
}
.pt-row:active{transform:scale(0.97);}
.pt-row.off{opacity:0.3;cursor:not-allowed;}
.pt-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.pt-info{flex:1;}
.pt-stat-name{font-size:12px;font-weight:700;}
.pt-stat-now{font-size:9px;color:var(--text2);margin-top:1px;}
.pt-stat-gain{font-size:9px;color:var(--green);}
.pt-plus{
  width:32px;height:32px;background:linear-gradient(135deg,#3a6a3a,#4a8a4a);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#fff;flex-shrink:0;
}

/* ===== 状態タブ ===== */
.stat-section{padding:6px 8px;}
.stat-job-card{
  background:linear-gradient(135deg,#1a1a3a,#2a2a5a);
  border:1px solid var(--accent);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
}
.stat-job-icon{font-size:28px;}
.stat-job-name{font-size:14px;font-weight:900;color:var(--accent2);}
.stat-job-sub{font-size:9px;color:var(--text2);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.stat-card{
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;
}
.stat-card-lbl{font-size:9px;color:var(--text2);margin-bottom:3px;}
.stat-card-val{font-size:18px;font-weight:900;}
.c-atk{color:#ee5050;}.c-def{color:#5090ee;}.c-hp{color:#50d080;}.c-exp{color:#ce93d8;}.c-gld{color:var(--gold);}

/* ===== ログ ===== */
.log-section{padding:6px 8px;}
.log-box{
  background:#0a0a18;border:1px solid var(--border);border-radius:8px;
  padding:6px 8px;height:180px;overflow-y:auto;
  font-size:10px;line-height:1.8;
}
.log-box::-webkit-scrollbar{width:3px;}
.log-box::-webkit-scrollbar-thumb{background:var(--border);}
.ln{color:var(--text2);}.ld{color:var(--text);}.lc{color:var(--c3);}.lg2{color:var(--c5);font-weight:700;}.lk{color:var(--accent);}.ll{color:var(--green);}

/* ===== ガチャモーダル ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{width:100%;max-width:480px;margin:0 auto;background:var(--panel);border-top:2px solid var(--accent);border-radius:16px 16px 0 0;padding:16px 12px 24px;transform:translateY(100%);transition:transform .3s;max-height:90dvh;overflow-y:auto;position:relative;}
.modal-overlay.open .modal-sheet{transform:translateY(0);}
.modal-title{font-size:16px;font-weight:900;color:var(--accent);text-align:center;margin-bottom:12px;}
.modal-close{position:absolute;top:12px;right:14px;font-size:20px;cursor:pointer;color:var(--text2);}
.gacha-btns{display:flex;gap:6px;margin-bottom:12px;}
.gacha-btn{flex:1;border:none;border-radius:10px;padding:10px 4px;font-size:11px;font-weight:900;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.gacha-btn:active{transform:scale(.94);}
.gacha-btn.x1{background:linear-gradient(135deg,#3a3a6a,#5a5a9a);color:#c0c0ff;}
.gacha-btn.x10{background:linear-gradient(135deg,#3a6a3a,#5a9a5a);color:#c0ffc0;}
.gacha-btn.x100{background:linear-gradient(135deg,#6a3a3a,#9a5a5a);color:#ffc0c0;}
.gacha-btn.off{opacity:.3;cursor:not-allowed;}
.gacha-btn .gcost{font-size:9px;opacity:.8;}
.pity-wrap{margin-bottom:12px;}
.pity-lbl{font-size:9px;color:var(--text2);margin-bottom:3px;display:flex;justify-content:space-between;}
.pity-bg{height:8px;background:#1a1a2a;border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.pity-fill{height:100%;background:linear-gradient(90deg,#aa6600,#ffaa00);border-radius:4px;transition:width .3s;}
.gacha-result{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px;min-height:50px;}
.r-card{background:var(--panel2);border-radius:8px;border:2px solid var(--border);padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:cardPop .3s ease-out;}
@keyframes cardPop{0%{transform:scale(0) rotate(-10deg);opacity:0}100%{transform:scale(1);opacity:1}}
.r-card .ri{font-size:22px;}
.r-card .rr{font-size:7px;font-weight:700;border-radius:3px;padding:1px 3px;}
.r-card .rn{font-size:7px;color:var(--text2);text-align:center;line-height:1.2;}
.rN{border-color:#555!important;}.rN .rr{background:#333;color:#aaa;}
.rR{border-color:#4a4!important;}.rR .rr{background:#1a3a1a;color:#7ddf64;}
.rE{border-color:#44a!important;}.rE .rr{background:#1a1a4a;color:#64b5f6;}
.rL{border-color:#a4a!important;}.rL .rr{background:#2a1a4a;color:#ce93d8;}
.rM{border-color:#aa4!important;background:linear-gradient(135deg,#1a1a00,#2a2a00)!important;}.rM .rr{background:#3a3a00;color:#fff176;}
.equip-slots{display:flex;flex-direction:column;gap:6px;padding:8px;}
.eq-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;}
.eq-ico{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--border);flex-shrink:0;background:var(--panel3);}
.eq-info{flex:1;}
.eq-type{font-size:9px;color:var(--text2);margin-bottom:2px;}
.eq-name{font-size:12px;font-weight:700;}
.eq-stats{font-size:9px;color:var(--green);margin-top:2px;}
.eq-btn{background:var(--panel3);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:10px;color:var(--text);cursor:pointer;flex-shrink:0;}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px;}

  {hp:2.0,atk:2.3,def:1.8},{hp:2.5,atk:3.0,def:2.2},
  {hp:3.2,atk:3.8,def:2.8},{hp:4.0,atk:5.0,def:3.5},
  {hp:5.5,atk:7.0,def:5.0},
];
const EMOJIS=['👺','🧟','🐺','💀','🦇','👻','🐉','😈','👿','🔮'];
const ENAMES=['ゴブリン','オーク','スライム','スケルトン','ウルフ','バンデット','ドラゴン','デーモン','リッチ','ワイバーン'];

function jm(){return JOB_DATA[G.jobIdx]?JOB_DATA[G.jobIdx].mul:JM[0];}
function atk(){return Math.floor((10+G.upLv.atk*5+G.ptSt.atk*3)*jm().atk);}
function def(){return Math.floor((5+G.upLv.def*3+G.ptSt.def*2)*jm().def);}
function mhp(){return Math.floor((100+G.upLv.hp*30+G.ptSt.hp*20)*jm().hp);}
function expR(){return+(1+G.upLv.expR*0.05).toFixed(2);}
function goldR(){return+(1+G.upLv.goldR*0.05).toFixed(2);}
function expNd(lv){return Math.floor(100*Math.pow(1.3,lv-1));}
function uCost(lv){return Math.floor(50*Math.pow(1.4,lv));}
function rCost(lv){return Math.floor(100*Math.pow(1.5,lv));}
function mCost(lv){return Math.floor(150*Math.pow(1.6,lv));}
function fmt(n){
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}

function spawn(){
  G.eMax=Math.floor(30*Math.pow(1.15,G.stage-1));
  G.eHp=G.eMax;
  G.eIco=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  const suf=G.stage>=15?'王':G.stage>=8?'長':'';
  G.eName=ENAMES[Math.floor(Math.random()*ENAMES.length)]+suf;
  document.getElementById('enemySprite').textContent=G.eIco;
  document.getElementById('enemyTag').textContent=G.eName;
}

function critHit(a){
  let defC=null;
  for(let i=G.crits.length-1;i>=0;i--){if(G.crits[i].rate>=100){defC=G.crits[i];break;}}
  let applied=defC;
  const si=defC?G.crits.indexOf(defC)+1:0;
  for(let i=G.crits.length-1;i>=si;i--){
    if(Math.random()*100<G.crits[i].rate){applied=G.crits[i];break;}
  }
  const mul=applied?applied.mul:1.0;
  const dmg=Math.max(1,Math.floor(a*mul)-Math.floor(def()*0.3));
  return{dmg,c:applied};
}

function showDmg(dmg,c){
  const scene=document.querySelector('.battle-scene');
  const el=document.createElement('div');
  el.className='dmg-num';
  const sz=c?18+G.crits.indexOf(c)*4:16;
  const col=c?c.col:'#ffffff';
  // 右寄り（敵側）に表示
  el.style.cssText=`font-size:${sz}px;color:${col};right:18%;top:35%;`;
  el.textContent=fmt(dmg)+(c?'\n'+c.name.replace('クリティカル','⚡'):'');
  scene.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

function showGain(gold,exp){
  const scene=document.querySelector('.battle-scene');
  ['🪙+'+fmt(gold),'✨+'+fmt(exp)].forEach((txt,i)=>{
    const el=document.createElement('div');
    el.className='gain-pop';
    el.style.cssText=`color:${i===0?'#e8c84a':'#88ccff'};bottom:${55+i*20}px;font-size:11px;`;
    el.textContent=txt;
    scene.appendChild(el);
    setTimeout(()=>el.remove(),1200);
  });
}

function tick(){
  if(G.eHp<=0)spawn();
  const{dmg,c}=critHit(atk());
  G.eHp=Math.max(0,G.eHp-dmg);
  showDmg(dmg,c);
  const cls=!c?'ld':c===G.crits[4]?'lg2':'lc';
  log(`${G.eName}に ${fmt(dmg)}${c?'【'+c.name+'】':''}`,'ld');
  if(G.eHp<=0){
    const g=Math.floor((G.stage*10+Math.random()*G.stage*5)*goldR());
    const e=Math.floor(G.stage*15*expR());
    G.gold+=g;addExp(e);
    showGain(g,e);
    G.gem+=10;log('💎ジェム+10','lg2');
    log(`${G.eName}撃破！ +${fmt(g)}G +${fmt(e)}EXP`,'lk');
    G.stage++;spawn();
  }
  render();
}

function addExp(e){
  G.exp+=e;
  while(G.exp>=expNd(G.lv)){
    G.exp-=expNd(G.lv);G.lv++;G.pt+=3;G.hp=mhp();
    log(`Lv${G.lv}！ Pt+3`,'ll');
  }
}

function buildUp(){
  const el=document.getElementById('upList');
  el.innerHTML='';
  UPS.forEach(u=>{
    const lv=G.upLv[u.k];
    const max=400;
    const pct=Math.min(100,lv/max*100);
    const cost=uCost(lv);
    const can=G.gold>=cost;
    const row=document.createElement('div');
    row.className='up-row';
    row.innerHTML=`
      <div class="up-icon" style="background:${u.bg}">${u.ico}</div>
      <div class="up-center">
        <div class="up-name">${u.name} <span style="font-size:9px;color:var(--text2)">Max Lv.${max}</span></div>
        <div class="up-lv-row">
          <span class="up-lv-txt">Lv.${lv}</span>
          <span class="up-arrow">→</span>
          <span class="up-next">${u.cur()} → ${u.nxt()}</span>
        </div>
        <div class="up-bar-bg"><div class="up-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="up-right">
        <button class="gold-btn${can?'':' off'}" onclick="doUp('${u.k}')">
          🪙<span class="gold-btn-cost">${fmt(cost)}</span>
        </button>
      </div>`;
    el.appendChild(row);
  });
}
function doUp(k){
  const cost=uCost(G.upLv[k]);
  if(G.gold<cost)return;
  G.gold-=cost;G.upLv[k]++;
  buildUp();render();
}

// ===== クリティカル =====
function buildCrit(){
  const el=document.getElementById('critList');
  el.innerHTML='';
  let defIdx=-1;
  for(let i=G.crits.length-1;i>=0;i--){if(G.crits[i].rate>=100){defIdx=i;break;}}
  G.crits.forEach((c,i)=>{
    const isDef=i===defIdx;
    const locked=i>0&&G.crits[i-1].rate<10;
    const rc=rCost(c.rateLv),mc=mCost(c.mulLv);
    const canR=!locked&&G.gold>=rc&&c.rate<100;
    const canM=!locked&&G.gold>=mc;
    const row=document.createElement('div');
    row.className='crit-row'+(isDef?' is-default':'');
    row.style.borderColor=isDef?c.col:'';
    row.innerHTML=`
      <div class="crit-icon" style="background:${c.colDark};border-color:${c.col}44">${c.ico}</div>
      <div class="crit-mid">
        <div class="crit-nm" style="color:${c.col}">
          ${c.name}
          ${isDef?'<span class="crit-badge">DEFAULT</span>':''}
          ${locked?'<span class="crit-lock">🔒</span>':''}
        </div>
        <div class="crit-stats">発動率: ${c.rate.toFixed(0)}% | 倍率: ×${c.mul.toFixed(1)}</div>
        <div class="crit-rate-bar">
          <div class="crit-rate-fill" style="width:${c.rate}%;background:${c.col}"></div>
        </div>
      </div>
      <div class="crit-btns">
        <button class="sm-btn${canR?'':' off'}" onclick="upCR(${i})">
          率UP<span class="sm-btn-cost">🪙${fmt(rc)}</span>
        </button>
        <button class="sm-btn${canM?'':' off'}" onclick="upCM(${i})">
          威力UP<span class="sm-btn-cost">🪙${fmt(mc)}</span>
        </button>
      </div>`;
    el.appendChild(row);
  });
}
function upCR(i){
  const c=G.crits[i];if(c.rate>=100)return;
  const cost=rCost(c.rateLv);if(G.gold<cost)return;
  G.gold-=cost;c.rateLv++;c.rate=Math.min(100,c.rate+5);
  buildCrit();render();
}
function upCM(i){
  const cost=mCost(G.crits[i].mulLv);if(G.gold<cost)return;
  G.gold-=cost;G.crits[i].mulLv++;G.crits[i].mul+=0.2;
  buildCrit();render();
}

function rollOne() {
  G.pity++;
  let rar;
  if (G.pity >= 100) { rar = RARITY[4]; G.pity = 0; }
  else {
    const r = Math.random() * 100;
    let acc = 0; rar = RARITY[0];
    for (const x of RARITY) { acc += x.rate; if (r < acc) { rar = x; break; } }
  }
  // レアリティに応じてプール選択
  const rarIdx = RARITY.indexOf(rar);
  const slotKeys = Object.keys(ITEM_POOL);
  const slot = slotKeys[Math.floor(Math.random() * slotKeys.length)];
  const pool = ITEM_POOL[slot];
  // 上位レアリティほど後ろのアイテム（強い）
  const maxIdx = Math.min(rarIdx + 1, pool.length);
  const minIdx = Math.max(0, rarIdx - 1);
  const base = pool[minIdx + Math.floor(Math.random() * (maxIdx - minIdx))];
  return {...base, rar, slot, uid: Date.now() + Math.random()};
}

function doGacha(n) {
  const cost = 30 * n;
  if (G.gem < cost) { log('💎が足りない！ステージ報酬で集めよう','ln'); return; }
  G.gem -= cost;
  const results = [];
  for (let i = 0; i < n; i++) results.push(rollOne());
  G.inventory.push(...results);

  // 最後10件表示
  const show = results.slice(-10);
  const el = document.getElementById('gachaResult');
  el.innerHTML = '';
  show.forEach((item, i) => {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'r-card r' + item.rar.id;
      c.innerHTML = '<span class="ri">' + item.ico + '</span><span class="rr">' + item.rar.name + '</span><span class="rn">' + item.name + '</span>';
      el.appendChild(c);
    }, i * 80);
  });

  const got = results.filter(r => r.rar.id === 'M');
  if (got.length) log('🎉 ' + got.map(g => g.name).join('/') + ' [ミシック]獲得！', 'lg2');
  const gotL = results.filter(r => r.rar.id === 'L');
  if (gotL.length) log('✨ ' + gotL.map(g => g.name).join('/') + ' [レジェンド]獲得！', 'lc');
  updatePity();
  render();
}

    const isSel = G._selInv && G._selInv.uid === item.uid;
    c.className = 'iv-card r' + item.rar.id + (isSel ? ' sel' : '');
    c.innerHTML = '<span class="ii">' + item.ico + '</span>' +
      '<span class="ir" style="background:' + item.rar.col + '22;color:' + item.rar.col + '">' + item.rar.name + '</span>' +
      '<span class="in">' + item.name + '</span>' +
      '<span class="is">' + getStatStr(item) + '</span>';
    c.onclick = () => { G._selInv = item; buildInvGrid(slot); };
    el.appendChild(c);
  });
}

function equipSelected() {
  if (!G._selInv || !G._equipSlot) return;
  G.equipped[G._equipSlot] = G._selInv;
  closeEquip();
  buildEquipTab();
  log(G._selInv.name + 'を装備した！', 'lk');
  render();
}

function equipBonus(stat) {
  let bonus = 0;
  Object.values(G.equipped).forEach(eq => { if (eq && eq.stat === stat) bonus += eq.v; });
  return bonus;
}

// 装備ボーナスを既存ステータス関数に上乗せ

def   = () => Math.floor(_baseDef()   + equipBonus('def'));
mhp   = () => Math.floor(_baseMhp()   + equipBonus('hp'));
expR  = () => +(_baseExpR()  + equipBonus('expR')).toFixed(2);

// クエスト進捗
G.questProg = {boss: {}};  // boss討伐数
G.bossKills = {};           // ボス名ごとの討伐数

// 転職クエスト進捗チェック
function checkQuestProg(jobIdx) {
  const job = JOB_DATA[jobIdx];
  return job.quests.map(q => {
    if (q.type === 'stage') {
      const cur = Math.min(G.stage - 1, q.need);
      return {q, cur, done: G.stage - 1 >= q.need};
    }
    if (q.type === 'boss') {
      const cur = G.bossKills[q.bossName] || 0;
      return {q, cur, done: cur >= q.need};
    }
    return {q, cur:0, done:false};
  });
}

function allQuestsDone(jobIdx) {
  return checkQuestProg(jobIdx).every(p => p.done);
}

function openJobModal() {
  buildJobModal();
  document.getElementById('jobModal').classList.add('open');
}
function closeJobModal() { document.getElementById('jobModal').classList.remove('open'); }

function buildJobModal() {
  const el = document.getElementById('jobModalBody');
  const curJob = JOB_DATA[G.jobIdx];
  const nextIdx = G.jobIdx + 1;
  const nextJob = JOB_DATA[nextIdx];

  // 現在の職業
  let html = '<div class="job-current-card">' +
    '<div class="job-current-ico">' + curJob.ico + '</div>' +
    '<div class="job-current-info">' +
      '<div class="job-current-label">現在の職業</div>' +
      '<div class="job-current-name">' + curJob.name + '</div>' +
      '<div class="job-current-num">' + (G.jobIdx + 1) + ' / ' + JOB_DATA.length + '</div>' +
    '</div>' +
  '</div>';

  if (!nextJob) {
    // 最終職業
    html += '<div class="job-complete-card"><div class="job-complete-txt">🎉 最強の職業に就いている！</div></div>';
    el.innerHTML = html;
    return;
  }

  // 次の職業
  const mulKeys = {hp:'HP', atk:'ATK', def:'DEF', gold:'GOLD', exp:'EXP'};
  const mulChips = Object.entries(nextJob.mul).map(([k,v]) =>
    '<span class="job-mul-chip">' + mulKeys[k] + ' ×' + v.toFixed(1) + '</span>'
  ).join('');

  html += '<div class="job-next-card">' +
    '<div class="job-next-label">▶ 次の職業</div>' +
    '<div class="job-next-name"><span class="jn-ico">' + nextJob.ico + '</span>' + nextJob.name + '</div>' +
    '<div class="job-mul-row">' + mulChips + '</div>' +
    '<div class="job-next-label">転職クエスト</div>' +
    '<div class="quest-list">';

  const progs = checkQuestProg(G.jobIdx);
  progs.forEach(p => {
    const doneClass = p.done ? ' done' : '';
    const check = p.done ? '✓' : '';
    const progTxt = p.q.type === 'stage'
      ? 'ステージ <span>' + Math.min(G.stage-1, p.q.need) + '</span> / ' + p.q.need
      : p.q.bossName + ' <span>' + (G.bossKills[p.q.bossName]||0) + '</span> / ' + p.q.need + '体';
    html += '<div class="quest-row' + doneClass + '">' +
      '<div class="quest-check">' + check + '</div>' +
      '<div>' +
        '<div class="quest-txt">' + p.q.label + '</div>' +
        '<div class="quest-prog">' + progTxt + '</div>' +
      '</div>' +
    '</div>';
  });

  const ready = allQuestsDone(G.jobIdx) && nextJob;
  html += '</div></div>';
  html += '<button class="job-transfer-btn' + (ready ? ' ready' : '') + '" onclick="doTransfer()">' +
    (ready ? '⚔ ' + nextJob.name + ' に転職する！' : '🔒 クエストを完了して転職') +
  '</button>';

  el.innerHTML = html;
}

function doTransfer() {
  const nextJob = JOB_DATA[G.jobIdx + 1];
  if (!nextJob || !allQuestsDone(G.jobIdx)) return;
  G.jobIdx++;
  G.hp = mhp(); // HP全回復
  log('🎉 【' + nextJob.name + '】に転職した！', 'lg2');
  updateJobBadge();
  buildJobModal();
  render();
}

function updateJobBadge() {
  const el = document.getElementById('jobSceneBadge');
  if (!el) return;
  const job = JOB_DATA[G.jobIdx];
  const hasNext = G.jobIdx < JOB_DATA.length - 1;
  el.textContent = job.ico + ' ' + job.name + (hasNext ? ' ▶転職' : ' MAX');
}

// ボス討伐判定（tick内から呼ぶ）
function checkBossKill(eName) {
  // ボス名リスト
  const bossNames = ['ゴブリン王','オーガ将軍','魔狼王フェンリル','竜騎士バルドル','魔将軍ザルゴス','暗黒騎士ヴァルム','真・魔王アビス'];
  if (bossNames.includes(eName)) {
    G.bossKills[eName] = (G.bossKills[eName] || 0) + 1;
    log('💀 ' + eName + ' 討伐！', 'lc');
  }
}

// ボスをランダムで出現（10の倍数ステージ）
const _origSpawn = spawn;
spawn = function() {
  _origSpawn();
  if (G.stage % 10 === 0) {
    const bossPool = ['ゴブリン王','オーガ将軍','魔狼王フェンリル','竜騎士バルドル','魔将軍ザルゴス','暗黒騎士ヴァルム','真・魔王アビス'];
    // 現在の転職クエストに必要なボスが最優先
    const curJob = JOB_DATA[G.jobIdx];
    const needed = curJob.quests
      .filter(q => q.type === 'boss' && !((G.bossKills[q.bossName]||0) >= q.need))
      .map(q => q.bossName);
    G.eName = needed.length ? needed[0] : bossPool[Math.floor(Math.random() * bossPool.length)];
    G.eMax = Math.floor(G.eMax * 3); // ボスはHP3倍
    G.eHp = G.eMax;
    document.getElementById('enemySprite').textContent = '👹';
    document.getElementById('enemyTag').textContent = G.eName;
    log('⚠ ボス【' + G.eName + '】が現れた！', 'lc');
  }
};

// 既存tick内のkill処理にボス判定を追加
const _origTick = tick;
tick = function() {
  const prevEHp = G.eHp;
  _origTick();
  // 討伐チェックはG.eHp===0になった瞬間
  if (prevEHp > 0 && G.eHp === 0) {
    checkBossKill(G.eName);
  }
};
